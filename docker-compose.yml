# Local Postgres for development without touching the Supabase project.
# Point DATABASE_URL at this to develop offline:
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/hackstack
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackstack
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackstack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
